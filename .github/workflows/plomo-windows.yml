name: PLOMO Windows

on:
  push:
    branches: [plomo]
    tags: ["v*"]
  pull_request:
    branches: [plomo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enter VS developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.1.*"
          version: 6.10.2
          modules: qtimageformats qtnetworkauth
          cache: true

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DLauncher_BUILD_PLATFORM=plomo
          -DLauncher_LOGIN_CALLBACK_URL=https://playplomo.com/login-success/
          -DLauncher_META_URL=https://cdn.playplomo.com/meta/v1/

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix install
          cmake --install build --config Release --prefix install --component portable

      - name: Stage installer contents
        shell: pwsh
        run: |
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          python plomo/tools/package_stage.py --install install --out stage --crt $crt.FullName

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DStageDir=$env:GITHUB_WORKSPACE\stage" plomo/installer/plomo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned launcher files
        uses: actions/upload-artifact@v4
        with:
          name: PLOMO-launcher-files-unsigned
          path: stage/**

      - name: Attest build provenance of the installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: plomo/installer/output/*.exe

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: PLOMO-Setup-unsigned
          path: plomo/installer/output/*.exe

  release:
    # Publishes the installer built above when a v* tag is pushed, as the latest release. The installer is not code-signed; checksums and a provenance attestation are published instead.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PLOMO-Setup-unsigned
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Same file under a fixed name, so /releases/latest/download/PLOMO-Setup.exe always points at the newest installer.
          cp dist/PLOMO-Setup-*.exe dist/PLOMO-Setup.exe
          (cd dist && sha256sum PLOMO-Setup*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/PLOMO-Setup-*.exe dist/PLOMO-Setup.exe dist/SHA256SUMS.txt --latest --title "PLOMO Launcher $GITHUB_REF_NAME" --notes-file plomo/release-notes.md
